; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = fakepod_nano

[env:fakepod_nano]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
; V3.4.1: force a fresh ESP-IDF sdkconfig generated from sdkconfig.defaults.
; PlatformIO preserves sdkconfig.<env>; old generated config had TinyUSB CDC disabled.
board_build.esp-idf.sdkconfig_path = sdkconfig.fakepod_nano_usbcdc
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
upload_port = COM10
monitor_port = COM10
upload_speed = 921600
monitor_speed = 115200
; 串口监视器将 DTR/RTS 初始状态固定为低，降低打开/关闭日志端口触发 ESP32-S3 USB 复位的风险。
; 只影响 monitor；不修改 upload/esptool，烧录完成后的自动复位仍保留。
monitor_dtr = 0
monitor_rts = 0
; APP_DIAG_PROFILE: 0=RELEASE, 1=DEBUG, 2=STRESS
build_flags =
	-DAPP_DIAG_PROFILE=0
monitor_filters =
	esp32_exception_decoder
	time
platform_packages =
	platformio/toolchain-xtensa-esp-elf@14.2.0+20251107
