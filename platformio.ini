; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = fakepod_nano

[env:fakepod_nano]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
upload_port = COM10
monitor_port = COM10
upload_speed = 921600
monitor_speed = 115200
build_flags =
	-DAPP_DIAG_AUDIO_RAM=0
	-DAPP_DIAG_AUDIO_POP=0
	-DAPP_DIAG_AUDIO_CLOCK=0
	-DAPP_DIAG_AUDIO_SOURCE=0
	-DAPP_DIAG_AUDIO_INDEX=0
	-DAPP_DIAG_AUDIO_WORKSPACE=0
	-DAPP_DIAG_TRANSPORT_INTENT=0
	-DAPP_DIAG_AUDIO_SEEK=0
	-DAPP_DIAG_AUDIO_CODEC=0
	-DAPP_DIAG_LIBRARY_METADATA=0
	-DAPP_DIAG_LIBRARY_ITEMS=0
	-DAPP_DIAG_LIBRARY_ARTWORK=0
	-DAPP_DIAG_ARTWORK_LOADER=0
	-DAPP_DIAG_ARTWORK_UI=0
	-DAPP_DIAG_SYSTEM_HEARTBEAT=0
	-DAPP_DIAG_PLAYER_PLAYLIST=0
	-DAPP_DIAG_PLAYER_TRANSPORT=0
	-DAPP_DIAG_FLAC_PERFORMANCE=0
	-DAPP_DIAG_MP3_PERFORMANCE=0
monitor_filters =
	esp32_exception_decoder
	time
platform_packages =
	platformio/toolchain-xtensa-esp-elf@14.2.0+20251107
